site_name: mkdocs-theme-rabe
site_url: https://radiorabe.github.io/mkdocs-theme-rabe/
site_description: >-
  MkDocs theme for Radio Bern RaBe – bundles the RaBe brand identity,
  required dependencies, and custom rendering logic.
repo_url: https://github.com/radiorabe/mkdocs-theme-rabe
repo_name: radiorabe/mkdocs-theme-rabe

theme:
  name: rabe
  palette:
    - scheme: slate
      primary: "#00c9bf"
      accent: "#00c9bf"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: "#00c9bf"
      accent: "#00c9bf"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/radio
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radiorabe/mkdocs-theme-rabe
      name: GitHub
  generator: false

plugins:
  - search
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

hooks:
  - mkdocs_theme_rabe/hooks.py

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Configuration:
      - configuration/index.md
      - Theme Options: configuration/theme.md
      - Modes: configuration/modes.md
      - Backstage: configuration/backstage.md
  - Reference:
      - reference/index.md
      - Hooks API: reference/hooks.md
